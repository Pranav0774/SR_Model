<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcribe</title>
<script>
  // Set the theme before first paint so the page never flashes the wrong colours.
  (function () {
    var t = null;
    try { t = localStorage.getItem("stt.theme"); t = t && JSON.parse(t); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #1f1d1a;
    --muted: #6d675d;
    --line: #cfc8ba;
    --accent: #8c3a1d;
    --accent-ink: #ffffff;
    --field: #fbfaf6;
    --ok: #4d6b3a;
    --glyph: 0.06;
    --shadow: 0 6px 18px rgba(60, 40, 20, .14);
    --sun: #f4b63f;
    --sunline: #e39a1c;
    --moonc: #e6e9f0;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  :root[data-theme="dark"] {
    --paper: #1b1a17;
    --ink: #e9e5db;
    --muted: #9a9385;
    --line: #3c3931;
    --accent: #d9825a;
    --accent-ink: #1b1a17;
    --field: #22211d;
    --ok: #9dbb84;
    --glyph: 0.08;
    --shadow: 0 6px 20px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
    font: 16px/1.55 system-ui, "Segoe UI", "Nirmala UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* colours ease over when the theme is switched, but not on first load */
  html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color .45s ease, color .45s ease, border-color .45s ease, fill .45s ease, stroke .45s ease !important;
  }

  /* ---------- floating letters in the background ---------- */
  #bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  #bg .g { position: absolute; bottom: -12vh; color: var(--ink); opacity: var(--glyph); will-change: transform; animation: rise linear infinite; }
  #bg .g > span { display: block; animation: sway ease-in-out infinite alternate; }
  @keyframes rise { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-125vh) rotate(9deg); } }
  @keyframes sway { from { transform: translateX(-16px); } to { transform: translateX(16px); } }

  main { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; padding: 36px 20px 80px; }
  main > * { animation: enter .7s var(--ease) both; }
  main > *:nth-child(1) { animation-delay: .02s; } main > *:nth-child(2) { animation-delay: .08s; }
  main > *:nth-child(3) { animation-delay: .14s; } main > *:nth-child(4) { animation-delay: .2s; }
  main > *:nth-child(5) { animation-delay: .26s; } main > *:nth-child(6) { animation-delay: .32s; }
  main > *:nth-child(7) { animation-delay: .38s; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font: 600 28px/1.2 Georgia, "Times New Roman", serif; margin: 0; }
  .right { display: flex; align-items: center; gap: 14px; }
  .mono { font: 13px ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted); }
  #ready::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 7px; transition: background-color .3s; }
  #ready.ok::before { background: var(--ok); }
  #ready.bad::before { background: var(--accent); }
  #ready.loading::before { animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .lede { color: var(--muted); margin: 6px 0 30px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  section { margin-bottom: 28px; }

  /* ---------- theme button: a small face, sun by day, moon by night ---------- */
  #theme { width: 46px; height: 46px; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; flex: none; transition: transform .35s var(--ease); }
  #theme:hover { transform: scale(1.1); }
  #theme:active { transform: scale(.94); }
  #theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #theme svg { width: 100%; height: 100%; overflow: visible; }
  #theme .spin { transform-origin: 24px 24px; transition: transform .7s var(--ease); }
  #theme .raysOut { transform-origin: 24px 24px; transition: transform .7s var(--ease), opacity .4s ease; }
  #theme .rays { transform-origin: 24px 24px; animation: turn 22s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  #theme .rays line { stroke: var(--sunline); stroke-width: 2.4; stroke-linecap: round; }
  #theme .body { fill: var(--sun); stroke: var(--sunline); stroke-width: 1.4; transition: fill .6s ease, stroke .6s ease; }
  #theme .crater { fill: #c9cedb; opacity: 0; transition: opacity .5s ease .1s; }
  #theme .face-line { fill: none; stroke: #3b2a1a; stroke-width: 1.7; stroke-linecap: round; }
  #theme .sclera { fill: #fffdf6; }
  #theme .pupil { fill: #2b2117; }
  #theme .glint { fill: #fff; }
  #theme .blush { fill: #f08a7a; opacity: .45; }
  #theme .eyes { transform-origin: 24px 22px; animation: blink-eyes 5.5s infinite; }
  @keyframes blink-eyes { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  :root[data-theme="dark"] #theme .body { fill: var(--moonc); stroke: #b8bfd0; }
  :root[data-theme="dark"] #theme .crater { opacity: .85; }
  :root[data-theme="dark"] #theme .raysOut { transform: rotate(120deg) scale(.4); opacity: 0; }
  :root[data-theme="dark"] #theme .spin { transform: rotate(360deg); }

  /* ---------- scroll-wheel language picker ---------- */
  .pick { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .wheel { position: relative; width: 210px; height: 132px; border-radius: 14px; background: var(--field); border: 1px solid var(--line); overflow: hidden; }
  .wheel:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wheel::before { content: ""; position: absolute; left: 8px; right: 8px; top: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--ink); opacity: .55; pointer-events: none; z-index: 2; }
  .wheel::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(var(--field) 0%, transparent 34%, transparent 66%, var(--field) 100%); }
  .wheel ul { list-style: none; margin: 0; padding: 44px 0; height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  .wheel ul::-webkit-scrollbar { display: none; }
  .wheel li { height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; cursor: pointer; font-size: 18px; user-select: none; }
  .note { max-width: 260px; color: var(--muted); font-size: 14px; min-height: 3em; transition: opacity .25s ease; }
  .note b { color: var(--ink); font-weight: 600; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; font: inherit; padding: 9px 18px; background: var(--field); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 10px; cursor: pointer; position: relative;
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), background-color .25s ease, color .25s ease, border-color .25s ease, opacity .25s ease;
  }
  .btn svg { width: 17px; height: 17px; flex: none; }
  .btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); transform: translateY(-2px); box-shadow: var(--shadow); }
  .btn:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, textarea:focus-visible, .linkbtn:focus-visible, .hist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 11px 26px; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 45%, transparent); }
  .btn.small { padding: 6px 13px; font-size: 14px; border-radius: 9px; border-color: var(--line); }
  .btn.small:hover:not(:disabled) { border-color: var(--ink); }
  .filebtn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer;
    background-image: linear-gradient(currentColor, currentColor); background-repeat: no-repeat; background-position: 0 100%; background-size: 0 1px; transition: background-size .3s var(--ease); }
  .linkbtn:hover { background-size: 100% 1px; }

  /* ---------- audio card ---------- */
  .drop { border: 1px dashed var(--line); background: color-mix(in srgb, var(--field) 88%, transparent); border-radius: 16px; padding: 20px;
    transition: border-color .25s ease, background-color .25s ease, transform .25s var(--ease); backdrop-filter: blur(3px); }
  .drop.over { border-color: var(--accent); border-style: solid; transform: scale(1.01); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--muted); font-size: 14px; }
  .microw { display: flex; align-items: center; gap: 18px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .mic { --lvl: 0; position: relative; width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--ink); background: var(--field); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; flex: none; padding: 0;
    transition: transform .3s var(--ease), background-color .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s var(--ease); }
  .mic svg { width: 26px; height: 26px; position: relative; z-index: 2; }
  .mic:hover { transform: scale(1.07); box-shadow: var(--shadow); }
  .mic:active { transform: scale(.96); }
  .mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .mic:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }
  .mic .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
  .mic.recording { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .mic.recording .ring { opacity: .5; transform: scale(calc(1.15 + var(--lvl) * .9)); transition: transform .09s linear; }
  .mic.recording .ring.r2 { opacity: .28; transform: scale(calc(1.45 + var(--lvl) * 1.25)); }
  .mic.recording .ring.r0 { opacity: 0; animation: ripple 1.8s ease-out infinite; }
  @keyframes ripple { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(2.1); } }
  .mic.recording svg { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: scale(1.12); } }
  .miclabel { display: grid; gap: 4px; min-width: 0; }
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 26px; opacity: 0; transition: opacity .3s ease; }
  .eq.on { opacity: 1; }
  .eq i { display: block; width: 5px; height: 100%; border-radius: 3px; background: var(--accent); transform-origin: bottom; transform: scaleY(.15); transition: transform .08s linear; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-top: 16px; cursor: pointer; width: fit-content; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; cursor: pointer; }

  #loadwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease), margin .45s var(--ease); margin-top: 0; }
  #loadwrap.open { grid-template-rows: 1fr; margin-top: 18px; }
  #loadwrap > div { overflow: hidden; min-height: 0; }
  #loaded .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  #fname { word-break: break-all; }
  audio { display: block; width: 100%; margin-top: 10px; }

  .go { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #status { color: var(--muted); font-size: 14px; }
  #status.error { color: var(--accent); }

  /* ---------- transcript + waiting animation ---------- */
  .tbox { position: relative; }
  textarea {
    display: block; width: 100%; min-height: 160px; resize: vertical; border: 1px solid var(--line); background: var(--field); border-radius: 14px;
    color: var(--ink); padding: 16px 18px; font: 18px/1.7 system-ui, "Segoe UI", "Nirmala UI", sans-serif;
    transition: opacity .35s ease, border-color .25s ease, box-shadow .25s ease;
  }
  textarea:hover { border-color: color-mix(in srgb, var(--ink) 40%, var(--line)); }
  textarea::placeholder { color: var(--muted); font-size: 15px; }
  .tbox.working textarea { opacity: 0; }
  textarea.reveal { animation: reveal .6s var(--ease); }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .wait { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; opacity: 0; pointer-events: none;
    border: 1px solid var(--line); border-radius: 14px; background: var(--field); transition: opacity .35s ease; }
  .tbox.working .wait { opacity: 1; }
  .tiles { display: flex; gap: 8px; }
  .tiles span { width: 34px; height: 44px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); font-size: 22px; color: var(--ink);
    background: var(--paper); animation: hop 1.3s ease-in-out infinite; }
  .tiles span:nth-child(3n+1) { border-color: var(--accent); color: var(--accent); }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-16px) rotate(-5deg); } 60% { transform: translateY(0) rotate(3deg); } }
  .waitmsg { color: var(--muted); font-size: 14px; }
  .after { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .actions { display: flex; gap: 10px; }

  .slide { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
  .slide.open { grid-template-rows: 1fr; }
  .slide > div { overflow: hidden; min-height: 0; }
  .transbox { padding-top: 24px; }
  #tout { min-height: 110px; }
  .tick { margin-top: 18px; }

  .hist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .hist li { border-bottom: 1px solid var(--line); }
  .hist button { display: flex; gap: 14px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer;
    padding: 10px 2px; align-items: baseline; transition: padding-left .3s var(--ease), color .25s ease; }
  .hist button:hover { padding-left: 10px; color: var(--accent); }
  .hist .when { flex: none; width: 96px; }
  .hist .snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #histhead { display: flex; justify-content: space-between; align-items: baseline; }

  @media (max-width: 520px) {
    main { padding-top: 22px; }
    .hist .when { width: 70px; }
    textarea { font-size: 17px; }
    .wheel { width: 100%; }
    .note { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main>
  <header>
    <h1>Transcribe</h1>
    <div class="right">
      <span id="ready" class="mono loading" role="status">Starting…</span>
      <button id="theme" type="button" aria-label="Switch between light and dark mode" title="Light / dark">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g class="spin">
            <g class="raysOut"><g class="rays">
              <line x1="24" y1="3" x2="24" y2="8"/><line x1="24" y1="40" x2="24" y2="45"/>
              <line x1="3" y1="24" x2="8" y2="24"/><line x1="40" y1="24" x2="45" y2="24"/>
              <line x1="9.1" y1="9.1" x2="12.6" y2="12.6"/><line x1="35.4" y1="35.4" x2="38.9" y2="38.9"/>
              <line x1="9.1" y1="38.9" x2="12.6" y2="35.4"/><line x1="35.4" y1="12.6" x2="38.9" y2="9.1"/>
            </g></g>
            <circle class="body" cx="24" cy="24" r="15"/>
            <circle class="crater" cx="32" cy="32" r="2.6"/><circle class="crater" cx="15" cy="34" r="1.8"/><circle class="crater" cx="34" cy="16" r="1.6"/>
          </g>
          <circle class="blush" cx="14.6" cy="27.6" r="2.4"/><circle class="blush" cx="33.4" cy="27.6" r="2.4"/>
          <g class="eyes">
            <ellipse class="sclera" cx="18.6" cy="22" rx="3.5" ry="3.9"/><ellipse class="sclera" cx="29.4" cy="22" rx="3.5" ry="3.9"/>
            <g id="eyeL"><circle class="pupil" cx="18.6" cy="22" r="2"/><circle class="glint" cx="19.2" cy="21.2" r=".7"/></g>
            <g id="eyeR"><circle class="pupil" cx="29.4" cy="22" r="2"/><circle class="glint" cx="30" cy="21.2" r=".7"/></g>
          </g>
          <path class="face-line" d="M18.6 28.6 Q24 33.6 29.4 28.6"/>
        </svg>
      </button>
    </div>
  </header>
  <p class="lede">Speak or upload a recording. English, Hindi and Tamil.</p>

  <section>
    <h2>Language</h2>
    <div class="pick">
      <div class="wheel" id="wheel" role="radiogroup" aria-label="Language" tabindex="0">
        <ul id="wl">
          <li role="radio" data-v="auto">Detect</li>
          <li role="radio" data-v="en">English</li>
          <li role="radio" data-v="hi" lang="hi">हिन्दी</li>
          <li role="radio" data-v="ta" lang="ta">தமிழ்</li>
        </ul>
      </div>
      <p class="note" id="langnote"></p>
    </div>
    <label class="check tick"><input type="checkbox" id="tr"> Also give me an English translation <span class="hint">&nbsp;Hindi and Tamil</span></label>
  </section>

  <section>
    <h2>Audio</h2>
    <div class="drop" id="drop">
      <div class="row">
        <label class="btn filebtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>Choose a file<input id="file" type="file" accept="audio/*,video/*"></label>
        <span class="hint">or drop one here</span>
      </div>
      <div class="microw">
        <button id="rec" class="mic" type="button" aria-label="Record from the microphone">
          <span class="ring r0"></span><span class="ring r1"></span><span class="ring r2"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/><path d="M8 23h8"/></svg>
        </button>
        <div class="miclabel">
          <span id="reclabel">Tap to record</span>
          <span id="timer" class="mono"></span>
          <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="auto"> Transcribe as soon as I stop recording</label>

      <div id="loadwrap"><div>
        <div id="loaded">
          <div class="top">
            <span><span id="fname"></span> <span class="mono" id="fdur"></span></span>
            <button class="linkbtn" id="clear" type="button">Remove</button>
          </div>
          <audio id="player" controls></audio>
        </div>
      </div></div>
    </div>
  </section>

  <section>
    <div class="go">
      <button id="go" class="btn primary" type="button" disabled>Transcribe</button>
      <span id="status" role="status"></span>
    </div>
  </section>

  <section>
    <h2>Transcript</h2>
    <div class="tbox" id="tbox">
      <textarea id="out" placeholder="The transcript will appear here. You can edit it before copying." spellcheck="false"></textarea>
      <div class="wait" aria-hidden="true">
        <div class="tiles" id="tiles"></div>
        <div class="waitmsg" id="waitmsg">Listening…</div>
      </div>
    </div>
    <div class="after">
      <span class="mono" id="info"></span>
      <span class="actions">
        <button class="btn small" id="copy" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>
        </button>
        <button class="btn small" id="save" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>Save as .txt</span>
        </button>
      </span>
    </div>
  </section>

  <section id="transsec" class="slide"><div>
    <div class="transbox" style="padding-top:0">
      <h2>English translation</h2>
      <textarea id="tout" spellcheck="false" lang="en"></textarea>
      <div class="after">
        <span class="mono" id="tinfo"></span>
        <span class="actions">
          <button class="btn small" id="tcopy" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>
          </button>
        </span>
      </div>
    </div>
  </div></section>

  <section id="histsec" hidden>
    <div id="histhead"><h2>Earlier in this browser</h2><button class="linkbtn" id="histclear" type="button">Clear</button></div>
    <ul class="hist" id="hist"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const NAMES = { en: "English", hi: "Hindi", ta: "Tamil" };
const ENGINE_NAMES = { r2t2: "R2T2", indic: "IndicConformer", whisper: "Whisper" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let blob = null, blobName = "", recorder = null, chunks = [], tickTimer = null;
let audioCtx = null, raf = 0, workTimer = null, lang = "auto", routes = {};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ================= floating letters ================= */
(function letters() {
  const sets = [
    "அஆஇஈஉஊஎஏஐஒஓகசதபமலவனயரள".split(""),
    "अआइईउऊएऐओऔकखगचजतपमलवशसह".split(""),
    "ABCDEGHKMNPRSTabdegkmnprst".split(""),
  ];
  const bg = $("bg"), n = innerWidth < 600 ? 16 : 30;
  for (let i = 0; i < n; i++) {
    const set = sets[i % 3], ch = set[Math.floor(Math.random() * set.length)];
    const g = document.createElement("div"), s = document.createElement("span");
    g.className = "g"; s.textContent = ch;
    if (i % 3 === 2) g.style.fontFamily = 'Georgia, "Times New Roman", serif';
    g.style.left = (Math.random() * 96) + "%";
    if (reduceMotion) { g.style.bottom = "auto"; g.style.top = (Math.random() * 92) + "%"; }
    g.style.fontSize = (26 + Math.random() * 60) + "px";
    const dur = 26 + Math.random() * 30;
    g.style.animationDuration = dur + "s";
    g.style.animationDelay = (-Math.random() * dur) + "s";
    s.style.animationDuration = (5 + Math.random() * 6) + "s";
    s.style.animationDelay = (-Math.random() * 6) + "s";
    g.append(s); bg.append(g);
  }
})();

/* ================= theme button ================= */
function applyTheme(t, animate) {
  const root = document.documentElement;
  if (animate) { root.classList.add("theming"); setTimeout(() => root.classList.remove("theming"), 700); }
  root.setAttribute("data-theme", t);
  store.set("stt.theme", t);
}
$("theme").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next, true);
  squint();
});

// eyes follow the cursor (smoothed)
const eyes = [$("eyeL"), $("eyeR")];
let target = { x: 0, y: 0 }, cur = { x: 0, y: 0 }, squinting = 0;
addEventListener("pointermove", e => {
  const r = $("theme").getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 160) * 1.6;
  target = { x: dx / d * k, y: dy / d * k };
}, { passive: true });
(function look() {
  cur.x += (target.x - cur.x) * 0.2; cur.y += (target.y - cur.y) * 0.2;
  eyes.forEach(e => e.setAttribute("transform", `translate(${cur.x.toFixed(2)} ${cur.y.toFixed(2)})`));
  requestAnimationFrame(look);
})();
function squint() {
  const g = document.querySelector("#theme .eyes");
  g.style.animation = "none"; void g.getBoundingClientRect();
  g.style.transition = "transform .12s"; g.style.transform = "scaleY(.15)";
  setTimeout(() => { g.style.transform = ""; g.style.animation = ""; }, 220);
}

/* ================= language wheel ================= */
const ITEM = 44, wl = $("wl"), items = [...wl.children];
function idxOf(v) { return Math.max(0, items.findIndex(li => li.dataset.v === v)); }
function paintWheel() {
  const pos = wl.scrollTop / ITEM;
  items.forEach((li, i) => {
    const d = Math.abs(pos - i), c = Math.min(d, 1.4);
    li.style.opacity = (1 - c * 0.5).toFixed(2);
    li.style.transform = `scale(${(1 - Math.min(d, 1) * 0.14).toFixed(3)})`;
    li.style.fontWeight = d < 0.5 ? "600" : "400";
    li.setAttribute("aria-checked", d < 0.5 ? "true" : "false");
  });
}
function chooseFromScroll() {
  const i = Math.min(items.length - 1, Math.max(0, Math.round(wl.scrollTop / ITEM)));
  const v = items[i].dataset.v;
  if (v !== lang) { lang = v; store.set("stt.lang", v); describe(); }
}
function setLang(v, smooth) { wl.scrollTo({ top: idxOf(v) * ITEM, behavior: smooth ? "smooth" : "auto" }); }
let ticking = false;
wl.addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { paintWheel(); chooseFromScroll(); ticking = false; });
}, { passive: true });
items.forEach(li => li.addEventListener("click", () => setLang(li.dataset.v, true)));
$("wheel").addEventListener("keydown", e => {
  const i = idxOf(lang);
  const map = { ArrowDown: i + 1, ArrowRight: i + 1, ArrowUp: i - 1, ArrowLeft: i - 1, Home: 0, End: items.length - 1 };
  if (e.key in map) { e.preventDefault(); setLang(items[Math.min(items.length - 1, Math.max(0, map[e.key]))].dataset.v, true); }
});
function describe() {
  const e = k => "<b>" + (ENGINE_NAMES[routes[k]] || "the configured engine") + "</b>";
  const text = {
    auto: "Works out whether it is English, Hindi or Tamil from the first 30 seconds.",
    en: "English speech, transcribed with " + e("en") + ".",
    hi: "Hindi speech, transcribed with " + e("hi") + ".",
    ta: "Tamil speech, transcribed with " + e("ta") + ".",
  };
  $("langnote").innerHTML = text[lang];
}
lang = store.get("stt.lang", "auto"); if (!items.some(li => li.dataset.v === lang)) lang = "auto";
requestAnimationFrame(() => { setLang(lang, false); paintWheel(); describe(); });
fetch("/api/routes").then(r => r.json()).then(r => { routes = r; describe(); }).catch(() => {});

/* ================= server readiness ================= */
async function pollStatus() {
  let done = false;
  try {
    const d = await (await fetch("/api/status")).json();
    const el = $("ready");
    if (d.error) { el.className = "mono bad"; el.textContent = "Models failed to load"; el.title = d.error; done = true; }
    else if (d.ready) { el.className = "mono ok"; el.textContent = "Models ready"; done = true; }
    else { el.className = "mono loading"; el.textContent = "Loading models" + (d.loading ? " · " + d.loading : "") + "…"; }
  } catch { $("ready").className = "mono bad"; $("ready").textContent = "Server not reachable"; }
  if (!done) setTimeout(pollStatus, 2000);
}
pollStatus();

/* ================= audio input ================= */
function fmt(s) { s = Math.round(s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function message(text, isError) { $("status").textContent = text; $("status").className = isError ? "error" : ""; }

function setAudio(b, name) {
  blob = b; blobName = name;
  $("fname").textContent = name; $("fdur").textContent = "";
  $("player").src = URL.createObjectURL(b);
  $("player").onloadedmetadata = () => { const d = $("player").duration; if (isFinite(d)) $("fdur").textContent = fmt(d); };
  $("loadwrap").classList.add("open");
  $("go").disabled = false;
  message("");
}
$("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) setAudio(f, f.name); });
const drop = $("drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) setAudio(f, f.name); });
$("clear").addEventListener("click", () => {
  blob = null; $("loadwrap").classList.remove("open"); $("go").disabled = true; $("file").value = "";
  setTimeout(() => $("player").removeAttribute("src"), 450);
});
$("tr").checked = store.get("stt.translate", false);
$("tr").addEventListener("change", () => store.set("stt.translate", $("tr").checked));
$("auto").checked = store.get("stt.auto", true);
$("auto").addEventListener("change", () => store.set("stt.auto", $("auto").checked));

/* ================= recording: mic ripples + level bars ================= */
const bars = [...document.querySelectorAll("#eq i")];
function animateMic(analyser) {
  const td = new Uint8Array(analyser.fftSize), fd = new Uint8Array(analyser.frequencyBinCount);
  let smooth = 0;
  (function frame() {
    analyser.getByteTimeDomainData(td);
    let sum = 0; for (let i = 0; i < td.length; i++) { const v = (td[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / td.length);
    smooth = Math.max(Math.min(1, rms * 5), smooth * 0.86);
    $("rec").style.setProperty("--lvl", smooth.toFixed(3));
    analyser.getByteFrequencyData(fd);
    const per = Math.floor(fd.length / 2 / bars.length);
    bars.forEach((b, i) => {
      let m = 0; for (let k = 0; k < per; k++) m += fd[i * per + k + 2];
      b.style.transform = `scaleY(${(0.12 + Math.min(1, (m / per) / 150) * 0.88).toFixed(2)})`;
    });
    raf = requestAnimationFrame(frame);
  })();
}
async function stopMic() {
  cancelAnimationFrame(raf);
  $("eq").classList.remove("on");
  $("rec").style.setProperty("--lvl", 0);
  bars.forEach(b => b.style.transform = "");
  if (audioCtx) { try { await audioCtx.close(); } catch {} audioCtx = null; }
}
$("rec").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { message("The microphone is blocked or not available. Allow it in the address bar, or upload a file instead.", true); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(tickTimer);
    await stopMic();
    $("rec").classList.remove("recording");
    $("reclabel").textContent = "Tap to record"; $("timer").textContent = "";
    if (!chunks.length) { message("Nothing was recorded.", true); return; }
    setAudio(new Blob(chunks, { type: recorder.mimeType }), "Recording");
    if ($("auto").checked) transcribe();
  };
  recorder.start();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const an = audioCtx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
  audioCtx.createMediaStreamSource(stream).connect(an);
  $("eq").classList.add("on");
  animateMic(an);
  const t0 = Date.now();
  $("rec").classList.add("recording");
  $("reclabel").textContent = "Listening… tap to stop";
  message("");
  $("timer").textContent = "00:00";
  tickTimer = setInterval(() => { $("timer").textContent = fmt((Date.now() - t0) / 1000); }, 250);
});

/* ================= waiting animation (letters from all three scripts) ================= */
const GLYPHS = "AaBbEeKkMmSsTt அஆஇஉஎஒகசதபமலவனயர अआइउएओकखगचजतपमलवशसह".replace(/ /g, "").split("");
const tiles = $("tiles");
for (let i = 0; i < 9; i++) {
  const s = document.createElement("span");
  s.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  s.style.animationDelay = (i * 0.11) + "s";
  s.addEventListener("animationiteration", () => { s.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; });
  tiles.append(s);
}
const WAIT_LINES = ["Listening…", "Reading the sound…", "Finding the words…", "Nearly there…"];

/* ================= transcription ================= */
async function transcribe() {
  if (!blob) return;
  const fd = new FormData();
  fd.append("audio", blob, blobName.includes(".") ? blobName : "recording.webm");
  fd.append("language", lang);
  fd.append("translate", $("tr").checked ? "1" : "0");
  $("go").disabled = true; $("rec").disabled = true;
  $("tbox").classList.add("working");
  $("info").textContent = "";
  const t0 = Date.now();
  const tick = () => {
    const s = Math.round((Date.now() - t0) / 1000);
    $("waitmsg").textContent = WAIT_LINES[Math.min(WAIT_LINES.length - 1, Math.floor(s / 6))] + "  " + s + " s";
    message("Working…");
  };
  tick(); workTimer = setInterval(tick, 1000);
  try {
    const r = await fetch("/api/transcribe", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "The request failed.");
    showResult(d); addHistory(d); message("");
  } catch (err) {
    message(err.message === "Failed to fetch" ? "The server is not reachable. Is the app still running?" : err.message, true);
  } finally {
    clearInterval(workTimer);
    $("tbox").classList.remove("working");
    $("go").disabled = false; $("rec").disabled = false;
  }
}
$("go").addEventListener("click", transcribe);

function showResult(d) {
  const out = $("out");
  out.value = d.text || ""; out.lang = d.language || "";
  out.classList.remove("reveal"); void out.offsetWidth; out.classList.add("reveal");
  if (!d.text) message("No speech was found in this audio.");
  $("info").textContent = `${NAMES[d.language] || d.language} · ${d.engine} · ${d.audio_seconds} s of audio, done in ${d.elapsed_seconds} s`;
  const t = $("tout");
  if (d.translation) {
    t.value = d.translation;
    t.classList.remove("reveal"); void t.offsetWidth; t.classList.add("reveal");
    $("tinfo").textContent = `${NAMES[d.language]} to English · NLLB-200`;
    $("transsec").classList.add("open");
  } else {
    $("transsec").classList.remove("open");
    if ($("tr").checked && d.language === "en" && d.text) $("info").textContent += " · already English";
  }
  syncActions();
}
function syncActions() { const has = $("out").value.trim().length > 0; $("copy").disabled = !has; $("save").disabled = !has; }
$("out").addEventListener("input", syncActions);

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("out").value); } catch { $("out").select(); document.execCommand("copy"); }
  const label = $("copy").querySelector("span"); label.textContent = "Copied";
  setTimeout(() => { label.textContent = "Copy"; }, 1500);
});
$("tcopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("tout").value); } catch { $("tout").select(); document.execCommand("copy"); }
  const label = $("tcopy").querySelector("span"); label.textContent = "Copied";
  setTimeout(() => { label.textContent = "Copy"; }, 1500);
});
$("save").addEventListener("click", () => {
  const a = document.createElement("a");
  const both = $("transsec").classList.contains("open") && $("tout").value.trim()
    ? $("out").value + "\n\n--- English translation ---\n" + $("tout").value : $("out").value;
  a.href = URL.createObjectURL(new Blob([both], { type: "text/plain;charset=utf-8" }));
  a.download = "transcript.txt"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ================= history ================= */
function addHistory(d) {
  if (!d.text) return;
  const list = store.get("stt.history", []);
  list.unshift({ t: Date.now(), language: d.language, engine: d.engine, seconds: d.audio_seconds, text: d.text, elapsed: d.elapsed_seconds, translation: d.translation || null });
  store.set("stt.history", list.slice(0, 12));
  renderHistory();
}
function renderHistory() {
  const list = store.get("stt.history", []);
  $("histsec").hidden = list.length === 0;
  $("hist").innerHTML = "";
  list.forEach(item => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    const when = document.createElement("span"); when.className = "when mono";
    when.textContent = new Date(item.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " " + item.language;
    const snip = document.createElement("span"); snip.className = "snip"; snip.textContent = item.text; snip.lang = item.language;
    b.append(when, snip);
    b.addEventListener("click", () => { showResult({ text: item.text, language: item.language, engine: item.engine, audio_seconds: item.seconds, elapsed_seconds: item.elapsed, translation: item.translation }); scrollTo({ top: $("out").getBoundingClientRect().top + scrollY - 120, behavior: "smooth" }); });
    li.append(b); $("hist").append(li);
  });
}
$("histclear").addEventListener("click", () => { store.set("stt.history", []); renderHistory(); });
renderHistory();
</script>
</body>
</html>
